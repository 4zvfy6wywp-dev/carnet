<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carnet de Chasse</title><meta name="description" content="The digital hunting logbook"><meta name="theme-color" content="#1b3122">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--fg:#1b3122;--fg2:#2c4a34;--brass:#b08a46;--brass2:#d8b878;--bg:#f3eee3;--card:#fffcf5;--line:#e4dccb;--t:#22201a;--m:#7d7564;--r:#9b3a2a;--ok:#3f7a4a;--warn:#c08a2a;--sh:0 1px 2px #0000000f,0 4px 14px #1b31220f;--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--sans:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#101a13;--card:#18261c;--line:#2a3b2e;--t:#ece6d6;--m:#a39b86;--fg2:#a9c4a0;--sh:0 1px 2px #0006}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg);font-variant-numeric:lining-nums}*{font-variant-numeric:lining-nums}body{margin:0;font:15px/1.45 var(--sans);background:var(--bg);color:var(--t);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-5px;flex:none}
header{background:linear-gradient(180deg,#1b3122,#152819);color:#f3ead2;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:1000;display:flex;align-items:center;gap:10px;border-bottom:1px solid #b08a4655}
header .logo{width:34px;height:34px;border-radius:9px}header h1{font:600 22px/1 var(--serif);margin:0;flex:1;letter-spacing:.3px}header h1 small{display:block;font:500 10px/1.4 var(--sans);letter-spacing:2px;text-transform:uppercase;color:var(--brass2);margin-top:3px}
.hb{background:#ffffff14;border:0;color:#f3ead2;width:42px;height:42px;border-radius:12px;display:grid;place-items:center}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;border-top:1px solid var(--line);z-index:1000;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px #0000000d}
nav button{flex:1;border:0;background:none;padding:6px 0;font:500 11px var(--sans);color:var(--m);border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:3px}nav button svg.i{width:24px;height:24px}
nav button.on{color:var(--fg);background:#b08a461f}@media(prefers-color-scheme:dark){nav button.on{color:var(--brass2)}}
main{padding:16px;max-width:760px;margin:auto}.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--sh);border:1px solid var(--line)}
h2{font:600 26px/1.15 var(--serif);color:var(--fg2);margin:8px 0 12px}h3{font:600 19px/1.2 var(--serif);margin:0 0 10px;color:var(--brass);display:flex;align-items:center;gap:8px}h3 .sp{flex:1}
.eyebrow{font:600 11px var(--sans);letter-spacing:1.6px;text-transform:uppercase;color:var(--brass)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font:600 15px var(--sans);background:var(--fg);color:#f6eedb;min-height:52px;margin:4px 0;cursor:pointer}
.btn.brass{background:linear-gradient(180deg,#c39a52,#a07a38);color:#1b1608}.btn.ghost{background:transparent;color:var(--t);border:1.5px solid var(--line)}.btn.red{background:var(--r)}.btn.wide{width:100%}.btn.sm{min-height:40px;padding:8px 12px;font-size:13px}
.btn:active,.chip:active,.tile:active{transform:scale(.97)}
label{display:block;font:600 11px var(--sans);letter-spacing:1px;text-transform:uppercase;color:var(--m);margin:14px 0 6px}
input,select,textarea{width:100%;font:16px var(--sans);padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--t)}input:focus,select:focus,textarea:focus{outline:2px solid var(--brass);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1.5px solid var(--line);background:var(--card);color:var(--t);border-radius:22px;padding:9px 14px;font:500 14px var(--sans);min-height:44px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--fg);color:#f6eedb;border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{border:1.5px solid var(--line);border-radius:16px;padding:10px 4px;min-height:88px;font:600 13px/1.2 var(--sans);background:var(--card);color:var(--t)}
.tile i{display:block;font-style:normal;font-size:28px;margin-bottom:4px}.tile small{display:block;color:var(--m);font:400 11px var(--sans);margin-top:2px}.tile.on{border-color:var(--brass);background:#b08a4626;box-shadow:inset 0 0 0 2px var(--brass)}.tile.prot small:after{content:' · protégé'}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.seg button{min-height:60px;font:600 15px var(--sans);border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--t)}.seg button b{display:block;font:600 20px var(--serif)}
.seg button.on{background:var(--fg);color:#f6eedb;border-color:var(--fg)}.seg.go button{background:var(--fg2);color:#fff;border-color:transparent}@media(prefers-color-scheme:dark){.seg.go button{color:#101a13}}
.seg button:disabled{opacity:.35}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.list .it{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.list .it:last-child{border:0}
.it img,.thumb{width:56px;height:56px;object-fit:cover;border-radius:12px;flex:none;background:var(--line)}.emo{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;font-size:28px;background:var(--bg);flex:none}
.muted{color:var(--m);font-size:13px}.tag{display:inline-block;background:#b08a4626;color:var(--brass);border-radius:8px;padding:2px 8px;font:600 11px var(--sans);margin-right:4px}.tag.g{background:#3f7a4a22;color:var(--ok)}.tag.r{background:#9b3a2a1f;color:var(--r)}
.map{height:240px;border-radius:14px;margin:8px 0;border:1px solid var(--line);z-index:0}#bigmap{height:62vh}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--sh)}.kpi b{display:block;font:700 30px/1 var(--serif);color:var(--fg2)}.kpi span{font-size:12px;color:var(--m)}
.hero{background:radial-gradient(120% 140% at 100% 0%,#2c4a34,#14261a);color:#f3ead2;border-radius:22px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden;border:1px solid #b08a4655}
.hero h2{color:#f3ead2;margin:4px 0 6px;font-size:30px}.hero .eyebrow{color:var(--brass2)}.hero p{margin:0 0 14px;color:#d9d0b8}.hero .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .btn.ghost{color:#f3ead2;border-color:#ffffff33}
.gps{display:flex;align-items:center;gap:10px;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:8px 8px 8px 12px;margin:8px 0}.gps .dot{width:12px;height:12px;border-radius:50%;background:var(--m);flex:none;box-shadow:0 0 0 4px #0000000d}
.gps .dot.ok{background:var(--ok)}.gps .dot.mid{background:var(--warn)}.gps .dot.bad{background:var(--r)}.gps .dot.wait{animation:p 1s infinite}@keyframes p{50%{opacity:.3}}.gps div{flex:1;font-size:13px}.gps b{font-weight:600}
.shotbtn{width:100%;min-height:88px;font:700 22px var(--serif);border-radius:20px;border:0;background:linear-gradient(180deg,#a8442f,#86301f);color:#fff;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 6px 18px #9b3a2a44}
.counter{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;margin:12px 0}.counter b{display:block;font:700 26px var(--serif);color:var(--fg2)}.counter span{font-size:11px;color:var(--m);text-transform:uppercase;letter-spacing:1px}
.stepper{display:flex;align-items:center;gap:8px}.stepper button{width:48px;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--t);font-size:22px}.stepper b{min-width:36px;text-align:center;font:700 24px var(--serif)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1b3122;color:#f3ead2;padding:12px 20px;border-radius:24px;z-index:3000;display:none;box-shadow:0 8px 24px #0004;border:1px solid #b08a4688;font-weight:500}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{font:600 11px var(--sans);letter-spacing:1px;text-transform:uppercase;color:var(--m)}td.n,th.n{text-align:center}
.lb{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.lb .rk{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 16px var(--serif);background:var(--bg);flex:none}
.lb.first .rk{background:linear-gradient(180deg,#e6c987,#b08a46);color:#1b1608}.bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--fg2),var(--brass))}
.trophy{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#2c4a34,#14261a);color:#f3ead2;border-radius:18px;padding:16px;margin-bottom:14px;border:1px solid #b08a4688}.trophy svg{width:54px;height:54px;stroke:#e6c987;flex:none}
.trophy b{font:700 22px var(--serif);display:block}.empty{text-align:center;padding:26px 10px;color:var(--m)}.empty svg{width:44px;height:44px;stroke:var(--brass);margin-bottom:8px}
.role{display:inline-flex;background:var(--bg);border-radius:14px;padding:4px;border:1.5px solid var(--line);width:100%}.role button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font:600 14px var(--sans);color:var(--m);min-height:44px}.role button.on{background:var(--fg);color:#f6eedb}
.kpi b,.counter b,.stepper b,.lb .rk,.lb>b,.seg button b,.num{font-family:var(--sans)!important;font-weight:700;letter-spacing:-.5px}.kpi b{font-size:26px}.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pgrid button{position:relative;padding:0;border:0;border-radius:12px;overflow:hidden;aspect-ratio:1;background:var(--line)}.pgrid img{width:100%;height:100%;object-fit:cover;display:block}.pgrid span{position:absolute;left:4px;bottom:4px;background:#000a;color:#fff;border-radius:8px;font-size:13px;padding:1px 5px}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.acts2 .btn{min-height:64px;font-size:17px;margin:0}.btn.shot{background:linear-gradient(180deg,#a8442f,#86301f);color:#fff}
.ov{position:fixed;inset:0;background:#0d170f;z-index:4000;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}.ov img{flex:1;min-height:0;width:100%;object-fit:contain}.ov .bar2{color:#eee;padding:10px 4px}.ov .chip{background:#ffffff1a;color:#fff;border-color:#ffffff33}.ov .chip.on{background:var(--brass);color:#1b1608}
.strip{display:flex;gap:6px;margin-top:8px;align-items:center}.strip img{width:52px;height:52px;object-fit:cover;border-radius:10px}
.hide{display:none!important}.leaflet-popup-content{font-family:var(--sans)}
@media print{header,nav,.noprint{display:none!important}body{background:#fff;color:#000;padding:0}.card,.kpi{box-shadow:none;border:1px solid #ccc;break-inside:avoid}}
</style></head><body>

<script>
const I=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const SEX=['Male','Female','Unknown'],SEXI={Male:'♂',Female:'♀',Unknown:'?'},SEXF={Male:'Mâle',Female:'Femelle',Unknown:'Indét.'};
const AGE=['Adult','Young','Unknown'],AGEI={Adult:'Ad',Young:'Juv',Unknown:'?'},AGEF={Adult:'Adulte',Young:'Jeune',Unknown:'Indét.'};
const TYPES=['Battue','Approche','Affût','Devant soi','Gibier d\'eau'],TYPEE={'Battue':'Driven hunt','Approche':'Stalk','Affût':'Hide','Devant soi':'Walked-up','Gibier d\'eau':'Wildfowling'};
const DEF_SP=[
['roe','Roe deer','Chevreuil','🦌','big',1],['red','Red deer','Cerf','🦌','big',1],['boar','Wild boar','Sanglier','🐗','big',1],['chamois','Chamois','Chamois','🐐','big',1],['mouflon','Mouflon','Mouflon','🐏','big',1],['fallow','Fallow deer','Daim','🦌','big',1],['fox','Fox','Renard','🦊','big',1],
['pheasant','Pheasant','Faisan','🐓','small',1],['greyp','Grey partridge','Perdrix grise','🐦','small',1],['redp','Red-legged partridge','Perdrix rouge','🐦','small',1],['woodcock','Woodcock','Bécasse','🐦','small',1],['mallard','Mallard','Colvert','🦆','small',1],['teal','Teal','Sarcelle','🦆','small',1],['woodpigeon','Woodpigeon','Palombe','🕊️','small',1],['hare','Hare','Lièvre','🐇','small',1],['rabbit','Rabbit','Lapin','🐇','small',1],
['badger','Badger','Blaireau','🦡','other',0],['wolf','Wolf','Loup','🐺','other',0],['lynx','Lynx','Lynx','🐈','other',0],['otter','Otter','Loutre','🦦','other',0],['stork','White stork','Cigogne','🦢','other',0],['crane','Common crane','Grue','🦩','other',0],['buzzard','Buzzard','Buse','🦅','other',0],['kite','Red kite','Milan royal','🦅','other',0],['eagle','Eagle','Aigle','🦅','other',0],['owl','Owl','Chouette / Hibou','🦉','other',0],['heron','Grey heron','Héron','🪶','other',0],['songbird','Songbird','Passereau','🐤','other',0]
].map(a=>({id:a[0],en:a[1],fr:a[2],ic:a[3],grp:a[4],game:!!a[5]}));
const GRP={big:['Big game','Grand gibier'],small:['Small game','Petit gibier'],other:['Other wildlife','Faune non chassable']};
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sa=x=>`${SEXI[x.sex]||'?'} ${SEXF[x.sex]||'Indét.'} · ${AGEF[x.age]||'Indét.'}`;
function blank(){return{v:5,me:{name:''},species:DEF_SP.map(s=>({...s})),hunts:[],sightings:[],imports:[],locations:[]}}

<div class="card" style="border:2px solid var(--brass)"><div class="row"><div style="flex:3"><div class="eyebrow">Active · since ${fmtT(d.start)}</div><button style="border:0;background:none;padding:0;font:600 24px var(--serif);color:var(--t);text-align:left" onclick="pickDriveName()">${dLabel(d)} <span style="font-size:14px;color:var(--brass)">✎</span></button></div>
<div style="flex:1"><label style="margin:0 0 4px">Poste</label><input value="${esc(d.post)}" inputmode="numeric" placeholder="—" style="text-align:center;font-size:20px;padding:8px" onchange="drv(cur).post=this.value;save()"></div></div>
<div class="acts2" style="margin:14px 0 0"><button class="btn shot" onclick="addShot()">${I('target')} +1 Shot</button>${camIn('addPhotos(this.files)','Photo','btn brass')}<button class="btn" onclick="editKill(-1)">${I('trophy')} Animal</button><button class="btn" style="background:var(--fg2)" onclick="S.ctx={h:cur.id,d:drv(cur).id};go('stalk')">${I('bino')} Seen</button></div>
<div class="counter"><div><b>${ds.length}</b><span>shots</span></div><div><b>${nK(dk)}</b><span>taken</span></div><div><b>${dsg.reduce((a,s)=>a+s.n,0)}</b><span>seen</span></div><div><b>${dp.length}</b><span>photos</span></div></div>
${PT.length?`<div class="card" style="background:var(--bg);margin-bottom:10px;padding:12px"><div class="eyebrow">Tag new photo${PT.length>1?'s':''} to an animal?</div><div class="chips" style="margin-top:8px">${dk.map(k=>`<button class="chip" onclick="cur.photos.forEach(p=>{if(PT.includes(p.id))p.killId='${k.id}'});PT=[];save();V.hunt(cur.id)">${sp(k.sp).ic} ${esc(sp(k.sp).fr||sp(k.sp).en)}</button>`).join('')}<button class="chip on" onclick="PT=[];V.hunt(cur.id)">Keep as photo</button></div></div>`:''}
${gallery(h,[...dp].sort((a,b)=>b.t-a.t))}
<div class="list">${dk.map(k=>{const i=h.kills.indexOf(k),np=kPh(h,k).length;return`<div class="it" onclick="editKill(${i})" style="cursor:pointer">${kImg(h,k)?`<img src="${kImg(h,k)}">`:`<div class="emo">${sp(k.sp).ic}</div>`}<div style="flex:1"><b>${esc(sp(k.sp).fr||sp(k.sp).en)}</b>${k.n>1?' ×'+k.n:''}<div class="muted">${sa(k)} · ${k.time||''}${np?' · 📷 '+np:''}</div></div>${camIn(`addPhotos(this.files,'${k.id}')`,'','chip')}</div>`}).join('')}
${dsg.map(s=>`<div class="it"><div class="emo">${sp(s.sp).ic}</div><div style="flex:1"><b>${esc(sp(s.sp).fr||sp(s.sp).en)}</b> ×${s.n} <span class="tag">seen</span><div class="muted">${sa(s)} · ${fmtT(s.t)}</div></div><button class="chip" onclick="D.sightings=D.sightings.filter(x=>x.id!=='${s.id}');save();V.hunt(cur.id)">${I('undo')}</button></div>`).join('')}
${[...ds].sort((a,b)=>b.t-a.t).map(s=>shotRow(h,s)).join('')}</div>
<button class="btn brass wide" style="min-height:64px;font-size:18px;margin-top:12px" onclick="nextDrive()">Next drive · Traque ${h.drives.length+1} ▶</button></div>
<div class="card"><h3>${I('trophy')}<span class="sp">Day total · ${n} taken · ${h.shots.length} shots</span></h3><div style="margin-bottom:8px">${totStr(totals(h.kills))}</div>
<table><tr><th>Traque</th><th class="n">Poste</th><th class="n">Shots</th><th class="n">Taken</th><th class="n">Seen</th></tr>${h.drives.map(x=>`<tr onclick="cur.cur='${x.id}';save();V.hunt(cur.id)" style="cursor:pointer;${x===d?'font-weight:700':''}"><td>${dLabel(x)}<br><span class="muted">${fmtT(x.start)}</span></td><td class="n">${esc(x.post||'–')}</td><td class="n">${inD(h,x,h.shots).length}</td><td class="n">${nK(inD(h,x,h.kills))}</td><td class="n">${D.sightings.filter(s=>s.huntId===h.id&&s.driveId===x.id).reduce((a,s)=>a+s.n,0)}</td></tr>`).join('')}</table></div>
<details class="card noprint"><summary style="font:600 19px var(--serif);color:var(--brass);cursor:pointer;min-height:32px">More · details, share, host</summary>
<div class="role" style="margin-top:12px"><button class="${h.role==='host'?'on':''}" onclick="setRole('host')">I'm hosting</button><button class="${h.role==='guest'?'on':''}" onclick="setRole('guest')">I'm a guest</button></div>
<div class="row"><button class="btn ${h.role==='host'?'brass':'ghost'}" onclick="F.hostDate='${h.date}';go('host')">${I('users')} Host summary</button><button class="btn ${h.role==='guest'?'brass':'ghost'}" onclick="shareDay()">${I('share')} Send to host</button></div>
<button class="btn ghost wide" onclick="shareLink()">${I('link')} Share as link</button><div id="linkbox"></div>
<label>Date</label><input type="date" value="${h.date}" onchange="H('date',this.value);V.hunt(cur.id)">
<label>Type</label><div class="chips">${TYPES.map((x,i)=>`<button class="chip ${x===h.type?'on':''}" onclick="H('type',TYPES[${i}]);V.hunt(cur.id)">${esc(x)}</button>`).join('')}</div>
${h.role==='guest'?`<label>Invited by · Invité par</label><input value="${esc(h.host)}" placeholder="Host name" onchange="H('host',this.value)">`:''}
<label>Voisins de poste</label><div class="chips">${h.neighbours.map((x,i)=>`<button class="chip on" onclick="cur.neighbours.splice(${i},1);save();V.hunt(cur.id)">${esc(x)} ${I('x')}</button>`).join('')}</div>
<div class="row" style="margin-top:8px"><input id="nb" placeholder="Add a neighbour" onkeydown="if(event.key==='Enter')addNb()"><button class="btn" style="flex:0" onclick="addNb()">${I('plus')}</button></div>
<label>Position</label>${gpsBar(h,'regps(cur,()=>V.hunt(cur.id))')}<div id="hmap" class="map"></div>
<label class="btn ghost wide" style="text-transform:none;letter-spacing:0;font:600 15px var(--sans);color:var(--t)">${I('video')} Import Shotkam clips<input type="file" accept="video/*,image/*" multiple class="hide" onchange="importClips(this.files)"></label>
<label>Notes</label><textarea rows="3" onchange="H('notes',this.value)">${esc(h.notes)}</textarea>
<button class="btn ghost wide" style="color:var(--r)" onclick="if(confirm('Delete this day?')){D.hunts=D.hunts.filter(x=>x!==cur);save();go('home')}">${I('trash')} Delete day</button></details>`;
const det=$('details');det.addEventListener('toggle',()=>{if(det.open&&!det._m){det._m=1;const m=mkMap($('#hmap'),h.pos,15);if(m){if(h.pos)lbl(h.pos,'Me').addTo(m);h.kills.forEach(k=>k.pos&&dot(k.pos,'#9b3a2a',8).addTo(m));m.on('click',e=>{h.pos=[+e.latlng.lat.toFixed(6),+e.latlng.lng.toFixed(6)];h.acc=0;const l=curLoc(h);if(l)l.pos=h.pos;save();toast('Position set')})}}})};

function shotRow(h,s){return`<div class="it">${s.clip&&s.clip.thumb?`<img src="${s.clip.thumb}" title="${esc(s.clip.name)}">`:`<div class="emo">${I('target')}</div>`}<div style="flex:1"><b>${fmtT(s.t)}</b> ${s.clip?`<span class="tag">${I('video').replace('class="i"','class="i" style="width:12px;height:12px"')} ${esc(s.clip.name)}</span>`:''}
<div class="muted">${s.pos?`±${s.acc??'?'} m`:'no GPS'} ${s.killId?'· '+esc(sp((h.kills.find(k=>k.id===s.killId)||{}).sp).en):''}</div>
<div class="chips" style="margin-top:6px"><button class="chip ${s.hit===true||s.killId?'on':''}" onclick="setHit('${s.id}',true)">Hit</button><button class="chip ${s.hit===false&&!s.killId?'on':''}" onclick="setHit('${s.id}',false)">Miss</button>
<select style="width:auto;flex:1;min-height:44px;padding:8px" onchange="linkShot('${s.id}',this.value)"><option value="">Animal…</option>${h.kills.map(k=>`<option value="${k.id}" ${s.killId===k.id?'selected':''}>${esc(sp(k.sp).en)} ${k.time||''}</option>`).join('')}</select>
<button class="chip" onclick="delShot('${s.id}')">${I('trash')}</button></div></div></div>`}
function H(k,v){cur[k]=v;save()}
function setRole(r){cur.role=r;if(r==='host')cur.host=me();else if(cur.host===me())cur.host='';save();V.hunt(cur.id)}
function addNb(){const v=$('#nb').value.trim();if(v){cur.neighbours.push(v);save();V.hunt(cur.id)}}
async function addShot(killId,after){const h=cur,s={id:uid(),t:Date.now(),driveId:(killId&&(h.kills.find(k=>k.id===killId)||(K&&K.id===killId&&K)||{}).driveId)||drv(h).id,pos:null,acc:null,hit:killId?true:null,killId:killId||null};h.shots.push(s);save();navigator.vibrate&&navigator.vibrate(60);toast('Shot logged · '+fmtT(s.t));(after||(()=>V.hunt(h.id)))();
const f=await gps();if(f){s.pos=f.pos;s.acc=f.acc;save();if(!after&&view==='hunt'&&cur===h)V.hunt(h.id)}}
function setHit(id,v){const s=cur.shots.find(x=>x.id===id);s.hit=v;if(!v)s.killId=null;save();V.hunt(cur.id)}
function linkShot(id,k){const s=cur.shots.find(x=>x.id===id);s.killId=k||null;if(k)s.hit=true;save();V.hunt(cur.id)}
function delShot(id){cur.shots=cur.shots.filter(x=>x.id!==id);save();V.hunt(cur.id)}
async function importClips(files){files=[...files];if(!files.length)return;toast(`Reading ${files.length} file${files.length>1?'s':''}…`);let att=0,cre=0;
for(const f of files){const isV=f.type.startsWith('video')||/\.(mp4|mov|m4v)$/i.test(f.name);const mt=isV?await mp4Time(f):null;const t=mt||f.lastModified||Date.now();
const th=isV?await vthumb(f):{thumb:await resize(f,480,.7)};const clip={name:f.name,t,src:mt?'mp4':'file',thumb:th.thumb||null,dur:th.dur||null};
const day=ldate(t);let h=(cur&&cur.date===day)?cur:D.hunts.find(x=>x.date===day);if(!h){h={id:uid(),date:day,locId:null,place:'',pos:null,acc:null,role:'guest',host:'',post:'',neighbours:[],type:'Battue',drives:[],kills:[],shots:[],photos:[],notes:''};h.drives.push({id:uid(),n:1,name:'',post:'',start:t});h.cur=h.drives[0].id;D.hunts.push(h)}
const cands=[...h.shots.filter(s=>!s.clip).map(s=>({o:s,t:s.t})),...h.kills.filter(k=>!k.clip&&k.time).map(k=>({o:k,t:new Date(h.date+'T'+k.time).getTime()}))];
let best=null;cands.forEach(c=>{const d=Math.abs(c.t-t);if(d<=15*60000&&(!best||d<best.d))best={...c,d}});
if(best){best.o.clip=clip;att++}else{h.shots.push({id:uid(),t,driveId:driveAt(h,t).id,pos:null,acc:null,hit:null,killId:null,clip});cre++}}
save();toast(`${att} clip${att!==1?'s':''} attached · ${cre} new shot${cre!==1?'s':''}`);V.hunt(cur&&D.hunts.includes(cur)?cur.id:undefined)}
/* ---------- KILL EDITOR ---------- */
let K=null,KI=-1,showAll=false;
function editKill(i){KI=i;K=i>=0?{...cur.kills[i]}:{id:uid(),driveId:drv(cur).id,sp:null,sex:'Unknown',age:'Unknown',n:1,time:hm(),photo:null,pos:null,acc:null,note:''};renderKill();if(i<0){K._wait=1;renderKill();gps(true).then(f=>{delete K._wait;if(f){K.pos=f.pos;K.acc=f.acc}if(view==='kill')renderKill()})}}
function spGrid(list,sel,fn){const g={};list.forEach(s=>(g[s.grp]=g[s.grp]||[]).push(s));
return Object.keys(GRP).filter(k=>g[k]).map(k=>`<div class="eyebrow" style="margin:14px 0 8px">${GRP[k][0]} · ${GRP[k][1]}</div><div class="grid">${g[k].map(s=>`<button class="tile ${sel===s.id?'on':''} ${s.game?'':'prot'}" onclick="${fn}('${s.id}')"><i>${s.ic}</i>${esc(s.fr||s.en)}<small>${esc(s.en)}</small></button>`).join('')}</div>`).join('')}
const seg=(arr,ic,fr,val,js,go)=>`<div class="seg ${go?'go':''}">${arr.map(s=>`<button class="${val===s?'on':''}" onclick="${js.replace('$',s)}"><b>${ic[s]}</b>${fr[s]}</button>`).join('')}</div>`;
function renderKill(){view='kill';const list=showAll?D.species:D.species.filter(s=>s.game);const ns=cur.shots.filter(s=>s.killId===K.id).length;title(KI>=0?'Edit animal':'Animal taken','Tableau · '+fmtD(cur.date));
const kp=cur.photos.filter(p=>p.killId===K.id);$('#app').innerHTML=`<div class="card"><h3>${I('cam')}<span class="sp">Photos · ${kp.length}</span></h3>${camIn(`addPhotos(this.files,'${K.id}',renderKill)`,kp.length?'Add more photos':'Take or add photos','btn brass wide')}${kp.length?`<div style="margin-top:10px">${gallery(cur,kp)}</div>`:''}${K.clip&&K.clip.thumb?`<div class="muted" style="margin-top:8px">Shotkam · ${esc(K.clip.name)}</div><img src="${K.clip.thumb}" style="width:100%;border-radius:14px">`:''}</div>
<div class="card"><h3><span class="sp">Espèce</span><button class="chip" onclick="showAll=!showAll;renderKill()">${showAll?'Game only':'All species'}</button></h3>${spGrid(list,K.sp,'kSp')}</div>
<div class="card"><h3>Sexe · Sex</h3>${seg(SEX,SEXI,SEXF,K.sex,"K.sex='$';renderKill()")}<h3 style="margin-top:14px">Âge · Age</h3>${seg(AGE,AGEI,AGEF,K.age,"K.age='$';renderKill()")}
<div class="row"><div><label>Time</label><input type="time" value="${K.time}" onchange="K.time=this.value"></div><div><label>Count</label><div class="stepper"><button onclick="K.n=Math.max(1,K.n-1);renderKill()">−</button><b>${K.n}</b><button onclick="K.n++;renderKill()">+</button></div></div></div></div>
<div class="card"><h3>${I('target')}<span class="sp">Shots at this animal · ${ns}</span><button class="chip" onclick="addShot('${K.id}',renderKill)">${I('plus')} Shot</button></h3><div class="muted">Each tap logs a hit with time and GPS.</div></div>
<div class="card"><h3>${I('pin')}<span class="sp">Position</span></h3>${gpsBar(K,'regps(K,renderKill)')}<div id="kmap" class="map"></div>
<label>Note</label><input value="${esc(K.note)}" onchange="K.note=this.value" placeholder="Weight, trophy, tracking…"></div>
<div class="row" style="position:sticky;bottom:90px"><button class="btn ghost" style="background:var(--card)" onclick="cancelKill()">Cancel</button>${KI>=0?`<button class="btn red" onclick="cur.kills.splice(KI,1);cancelKill()">${I('trash')}</button>`:''}<button class="btn" style="flex:2" onclick="saveKill()">${I('check')} Save</button></div>`;
const m=mkMap($('#kmap'),K.pos||cur.pos,15);if(m){if(K.pos)dot(K.pos,'#9b3a2a',9).addTo(m);m.on('click',e=>{K.pos=[+e.latlng.lat.toFixed(6),+e.latlng.lng.toFixed(6)];K.acc=0;renderKill()})}}
function kSp(id){K.sp=id;renderKill()}
function cancelKill(){cur.photos.forEach(p=>{if(p.killId&&!cur.kills.find(k=>k.id===p.killId))p.killId=null});cur.shots.forEach(s=>{if(s.killId&&!cur.kills.find(k=>k.id===s.killId))s.killId=null});save();V.hunt(cur.id)}
function saveKill(){if(!K.sp)return toast('Choose a species');if(!sp(K.sp).game&&!confirm(sp(K.sp).en+' is marked protected / non-game. Save anyway?'))return;delete K._wait;KI>=0?cur.kills[KI]=K:cur.kills.push(K);save();toast('Saved to tableau');V.hunt(cur.id)}
V.loc=()=>{V.hunt();pickLoc()};
V.kill=()=>{V.hunt();if(cur&&cur.kills.length)editKill(0)};
/* ---------- STALKING ---------- */
let S={sp:null,sex:null,n:1,shot:false,ctx:null};
V.stalk=()=>{const cx=S.ctx&&D.hunts.find(h=>h.id===S.ctx.h),cd=cx&&cx.drives.find(d=>d.id===S.ctx.d);if(S.ctx&&!cd)S.ctx=null;title(cd?'Seen · '+dLabel(cd):'Mode Approche',cd?'Tap species · sex · age':'Species · sex · age');const td=D.sightings.filter(s=>ldate(s.t)===today()).sort((a,b)=>b.t-a.t);const dis=S.sp?'':'disabled';
$('#app').innerHTML=`${cd?`<button class="btn ghost wide" onclick="S.ctx=null;go('hunt','${cx.id}')">${I('undo')} Back to ${dLabel(cd)}</button>`:''}${gpsBar(G,'regps(null)','livegps')}
<div class="card" style="position:sticky;top:76px;z-index:600"><div class="eyebrow">${S.sp?`${sp(S.sp).ic} ${esc(sp(S.sp).fr||sp(S.sp).en)} · choose sex, tap age to save`:'1 · Species  2 · Sex  3 · Age saves'}</div>
<div class="seg">${SEX.map(s=>`<button ${dis} class="${S.sex===s?'on':''}" onclick="S.sex='${s}';V.stalk()"><b>${SEXI[s]}</b>${SEXF[s]}</button>`).join('')}</div>
<div class="seg go">${AGE.map(s=>`<button ${dis} onclick="sight('${s}')"><b>${AGEI[s]}</b>${AGEF[s]} ✓</button>`).join('')}</div>
<div class="row"><div class="stepper" style="flex:0"><button onclick="S.n=Math.max(1,S.n-1);V.stalk()">−</button><b>${S.n}</b><button onclick="S.n++;V.stalk()">+</button></div><button class="chip ${S.shot?'on':''}" onclick="S.shot=!S.shot;V.stalk()">${I('target')} Shot</button>${S.sp?`<button class="chip" onclick="sight('Unknown')">Quick save</button>`:td.length?camIn(`sightPhoto(this.files,'${td[0].id}')`,'Last','chip'):''}</div></div>
<div class="row"><input id="q" placeholder="Search or add a species…" oninput="filt(this.value)"><button class="btn brass" style="flex:0" onclick="addSp($('#q').value)">${I('plus')}</button></div>
<div id="spg">${spGrid(D.species,S.sp,'sSp')}</div>
<h2 style="margin-top:22px">Aujourd'hui · ${td.length}</h2><div class="card list">${td.length?td.map(s=>`<div class="it"><div class="emo">${sp(s.sp).ic}</div><div style="flex:1"><b>${esc(sp(s.sp).fr||sp(s.sp).en)}</b> ×${s.n} ${s.shot?'<span class="tag r">shot</span>':''}${sp(s.sp).game?'':'<span class="tag">protégé</span>'}<div class="muted">${sa(s)}</div><div class="muted">${fmtT(s.t)} · ${s.pos?'±'+(s.acc??'?')+' m':'no GPS'}</div>${(s.photos||[]).length?`<div class="strip">${s.photos.map(p=>`<img src="${p.img}" onclick="viewPhoto('${p.id}','${s.id}')">`).join('')}</div>`:''}</div>${camIn(`sightPhoto(this.files,'${s.id}')`,'','chip')}<button class="chip" onclick="resight('${s.id}')" aria-label="Refresh position">${I('refresh')}</button><button class="chip" onclick="D.sightings=D.sightings.filter(x=>x.id!=='${s.id}');save();V.stalk()" aria-label="Undo">${I('undo')}</button></div>`).join(''):'<div class="muted">No sightings yet today.</div>'}</div>
<div id="smap" class="map"></div>`;
const m=mkMap($('#smap'),(td.find(s=>s.pos)||G||{}).pos,14);if(m)td.forEach(s=>s.pos&&dot(s.pos,s.shot?'#9b3a2a':sp(s.sp).game?'#2c4a34':'#3b6e8f').addTo(m).bindPopup(`${sp(s.sp).en} · ${sa(s)} ×${s.n}<br>${fmtT(s.t)} ±${s.acc} m`))};
function sSp(id){S.sp=id;V.stalk()}
function filt(q){q=q.toLowerCase();$('#spg').innerHTML=spGrid(D.species.filter(s=>(s.en+' '+s.fr).toLowerCase().includes(q)),S.sp,'sSp')}
function addSp(name){name=(name||'').trim();if(!name)return toast('Type a species name');const ex=D.species.find(s=>s.en.toLowerCase()===name.toLowerCase()||(s.fr||'').toLowerCase()===name.toLowerCase());if(ex){S.sp=ex.id;return V.stalk()}
const game=confirm(`Add “${name}” to your species.\n\nOK = game species (chassable)\nCancel = protected / non-game`);const s={id:'c_'+uid(),en:name,fr:name,ic:game?'🎯':'👁️',grp:game?'big':'other',game};D.species.push(s);save();S.sp=s.id;toast('Added '+name);V.stalk()}
async function sight(age){const s={id:uid(),t:Date.now(),photos:[],huntId:S.ctx?S.ctx.h:null,driveId:S.ctx?S.ctx.d:null,sp:S.sp,sex:S.sex||'Unknown',age,n:S.n,shot:S.shot,pos:null,acc:null};D.sightings.push(s);save();navigator.vibrate&&navigator.vibrate(40);toast(`✓ ${sp(s.sp).fr||sp(s.sp).en} · ${SEXF[s.sex]} · ${AGEF[age]} ×${s.n}`);
const back=S.ctx;S={sp:null,sex:null,n:1,shot:false,ctx:null};if(back){go('hunt',back.h)}else V.stalk();const f=await gps();if(f){s.pos=f.pos;s.acc=f.acc;save();if(view==='stalk')V.stalk()}}
async function sightPhoto(files,id){const s=D.sightings.find(x=>x.id===id);if(!s)return;s.photos=s.photos||[];const f0=await gps();for(const f of [...files]){const img=await resize(f,800,.7);if(img)s.photos.push({id:uid(),t:Date.now(),img,pos:f0?f0.pos:s.pos,acc:f0?f0.acc:s.acc})}save();toast('Photo added to '+(sp(s.sp).fr||sp(s.sp).en));V.stalk()}
function resight(id){const s=D.sightings.find(x=>x.id===id);regps(s,()=>view==='stalk'&&V.stalk())}

async function dayPack(h,thumbs){const sg=D.sightings.filter(s=>s.huntId===h.id||(!s.huntId&&ldate(s.t)===h.date));const th=async x=>thumbs&&x?await resize(x,240,.6):undefined;

const photos=[];for(const p of h.photos||[])photos.push({id:p.id,t:p.t,killId:p.killId,pos:p.pos,acc:p.acc,thumb:await th(p.img)});const sgs=[];for(const s of sg){const ps=[];for(const p of s.photos||[])ps.push({t:p.t,thumb:await th(p.img)});sgs.push({id:s.id,driveId:s.driveId,t:s.t,sp:s.sp,sex:s.sex,age:s.age,n:s.n,shot:s.shot,pos:s.pos,acc:s.acc,photos:thumbs?ps:[]})}
const used=new Set([...kills.map(k=>k.sp),...sg.map(s=>s.sp)]);
return{format:'carnet-day',v:2,drives:h.drives.map(({id,n,name,post,start})=>({id,n,name,post,start})),hunter:me(),date:h.date,place:h.place,post:h.post,pos:h.pos,acc:h.acc,host:h.host,type:h.type,species:D.species.filter(s=>used.has(s.id)).map(({id,en,fr,ic,grp,game})=>({id,en,fr,ic,grp,game})),kills,shots,photos:thumbs?photos:[],sightings:sgs,sent:Date.now()}}

function board(sz){const b={};const add=(n,k,s,d)=>{const o=b[n]=b[n]||{name:n,k:0,s:0,days:new Set()};o.k+=k;o.s+=s;o.days.add(d)};

return Object.values(b).sort((a,c)=>((c.s>=3)-(a.s>=3))||(c.s?c.k/c.s:-1)-(a.s?a.k/a.s:-1)||c.k-a.k)}

function csv(){const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;const r=[['record','hunter','date','time','species','species_fr','game','sex','age','count','hit','lat','lon','gps_acc_m','place','host','post','neighbours','type','clip','note']];
D.hunts.forEach(h=>{h.kills.forEach(k=>{const p=k.pos||h.pos||[];r.push(['kill',me(),h.date,k.time,sp(k.sp).en,sp(k.sp).fr,sp(k.sp).game,k.sex,k.age,k.n,'',p[0],p[1],k.acc,h.place,h.host,h.post,h.neighbours.join('; '),h.type,k.clip&&k.clip.name,k.note])});
h.shots.forEach(s=>{const p=s.pos||[];const k=h.kills.find(x=>x.id===s.killId);r.push(['shot',me(),h.date,fmtT(s.t),k?sp(k.sp).en:'','','','','','',s.hit===true||s.killId?1:s.hit===false?0:'',p[0],p[1],s.acc,h.place,h.host,h.post,'',h.type,s.clip&&s.clip.name,''])})});
D.sightings.forEach(s=>{const p=s.pos||[];r.push(['sighting',me(),ldate(s.t),fmtT(s.t),sp(s.sp).en,sp(s.sp).fr,sp(s.sp).game,s.sex,s.age,s.n,s.shot?1:'',p[0],p[1],s.acc,'','','','','','',''])});
D.imports.forEach(x=>(x.kills||[]).forEach(k=>{const p=k.pos||x.pos||[];r.push(['kill',x.hunter,x.date,k.time,sp(k.sp).en,sp(k.sp).fr,sp(k.sp).game,k.sex,k.age,k.n,'',p[0],p[1],k.acc,x.place,x.host,x.post,'',x.type,'',k.note])}));
dl('carnet-'+today()+'.csv','\ufeff'+r.map(x=>x.map(q).join(',')).join('\n'),'text/csv')}
/* ---------- SETTINGS ---------- */
V.settings=()=>{title('Réglages','Settings');$('#app').innerHTML=`<div class="card"><h3>${I('users')}<span class="sp">Hunter profile</span></h3><label style="margin-top:0">Your name · Nom du chasseur</label><input value="${esc(D.me.name)}" placeholder="Shown to hosts and on leaderboards" onchange="D.me.name=this.value.trim();save();toast('Saved')"></div>
<div class="card"><h3>${I('down')}<span class="sp">Backup &amp; export</span></h3><button class="btn wide" onclick="dl('carnet-backup-'+today()+'.json',JSON.stringify(D),'application/json')">${I('down')} Full backup (JSON)</button>
<label class="btn ghost wide" style="text-transform:none;letter-spacing:0;font:600 15px var(--sans);color:var(--t)">${I('up')} Restore backup or import .carnet<input type="file" accept=".json,.carnet,application/json" multiple class="hide" onchange="imp(this.files)"></label><button class="btn ghost wide" onclick="csv()">${I('down')} Export CSV</button>

<div class="card"><h3><span class="sp">Espèces · Species</span></h3><p class="muted" style="margin-top:0">🎯 game species appear in the tableau picker; 🛡️ protected species only in observations.</p><div class="list">${D.species.map((s,i)=>`<div class="it" style="flex-wrap:wrap"><input style="width:58px;flex:0;text-align:center;font-size:22px;padding:8px" value="${s.ic}" onchange="D.species[${i}].ic=this.value;save()"><div style="flex:1;min-width:150px"><input value="${esc(s.fr)}" placeholder="Nom français" onchange="D.species[${i}].fr=this.value;save()" style="margin-bottom:6px"><input value="${esc(s.en)}" placeholder="English" onchange="D.species[${i}].en=this.value;save()"></div>
<div class="chips" style="width:100%"><select style="width:auto;flex:1" onchange="D.species[${i}].grp=this.value;save()">${Object.keys(GRP).map(g=>`<option value="${g}" ${s.grp===g?'selected':''}>${GRP[g][0]}</option>`).join('')}</select><button class="chip ${s.game?'on':''}" onclick="D.species[${i}].game=!D.species[${i}].game;save();V.settings()">${s.game?'🎯 Game':'🛡️ Protected'}</button><button class="chip" onclick="D.species.splice(${i},1);save();V.settings()">${I('trash')}</button></div></div>`).join('')}</div>
<div class="row" style="margin-top:10px"><input id="ns" placeholder="New species"><button class="btn" style="flex:0" onclick="if($('#ns').value.trim()){D.species.push({id:'c_'+uid(),en:$('#ns').value.trim(),fr:$('#ns').value.trim(),ic:'❔',grp:'other',game:false});save();V.settings()}">${I('plus')}</button></div>
<button class="btn ghost wide" onclick="if(confirm('Restore the default species list?')){D.species=DEF_SP.map(s=>({...s}));save();V.settings()}">Restore default species</button></div>
<div class="card"><h3><span class="sp">Data</span></h3><button class="btn ghost wide" onclick="sample();go('home')">Explore with a sample season</button><button class="btn ghost wide" style="color:var(--r)" onclick="if(confirm('Erase ALL data on this device?')){localStorage.removeItem('carnet');D=blank();go('home')}">${I('trash')} Erase all data</button>
<p class="muted" style="text-align:center;margin-bottom:0">Carnet de Chasse · v5 · works offline</p></div>`};
async function imp(files){const ps=await readFiles(files);let days=0;for(const d of ps){if(!d)continue;if(d.format==='carnet-day'){addImport(d);days++}else if(d.species&&d.hunts){if(!confirm('Replace all data on this device with this backup?'))continue;D=mig(d);toast('Backup restored')}}save();if(days)toast(`Imported ${days} hunter day${days>1?'s':''}`);go(days?'host':'home')}
/* ---------- SAMPLE SEASON ---------- */
function sample(){if(!D.me.name)D.me.name='Antoine Laurent';const c=[47.497,1.912],j=(b,r)=>[+(b[0]+(Math.random()-.5)*(r||.01)).toFixed(5),+(b[1]+(Math.random()-.5)*(r||.01)).toFixed(5)],T=(d,h)=>new Date(d+'T'+h).getTime();
const k1=uid(),k2=uid(),k3=uid();const d1='2026-10-04',d2='2026-09-27',d3='2026-10-10';
D.hunts.push({id:uid(),date:d1,place:'Domaine des Chênes, Sologne',pos:c,acc:6,role:'host',host:me(),post:'4',neighbours:['Marc Fournier','Sophie Bernard'],type:'Battue',notes:'Six traques, grand soleil. Belle compagnie de sangliers dans la 3e.',
kills:[{id:k1,sp:'boar',sex:'Male',age:'Adult',n:1,time:'10:42',pos:j(c,.004),acc:5,note:'78 kg'},{id:k2,sp:'roe',sex:'Female',age:'Young',n:1,time:'14:15',pos:j(c,.004),acc:8,note:''}],
shots:[{id:uid(),t:T(d1,'10:41'),pos:c,acc:6,hit:false,killId:null},{id:uid(),t:T(d1,'10:42'),pos:c,acc:6,hit:true,killId:k1},{id:uid(),t:T(d1,'14:15'),pos:c,acc:7,hit:true,killId:k2},{id:uid(),t:T(d1,'15:30'),pos:c,acc:9,hit:false,killId:null}]},
{id:uid(),date:d2,place:'Plaine de Beauce',pos:[48.21,1.62],acc:12,role:'guest',host:'Claire Martin',post:'2',neighbours:['Paul Girard'],type:'Devant soi',notes:'',
kills:[{id:k3,sp:'pheasant',sex:'Male',age:'Adult',n:3,time:'11:05',pos:[48.212,1.623],acc:10,note:''},{id:uid(),sp:'greyp',sex:'Unknown',age:'Unknown',n:2,time:'15:30',pos:null,acc:null,note:''}],
shots:[...Array(8)].map((_,i)=>({id:uid(),t:T(d2,'1'+(i%5)+':'+(10+i*5)),pos:[48.21+i*.001,1.62],acc:14,hit:i<5,killId:i===0?k3:null}))},
{id:uid(),date:d3,place:'Bois de la Ferté',pos:[47.62,2.05],acc:18,role:'guest',host:'Henri Dubois',post:'7',neighbours:['Henri Dubois'],type:'Battue',notes:'',kills:[],shots:[{id:uid(),t:T(d3,'11:20'),pos:[47.62,2.05],acc:18,hit:false,killId:null}]});
[['roe','Female','Adult',2,'09:12'],['red','Male','Adult',1,'09:40'],['buzzard','Unknown','Adult',1,'11:02'],['crane','Unknown','Adult',14,'12:30'],['boar','Unknown','Young',5,'10:35']].forEach(([s,x,a,n,h])=>D.sightings.push({id:uid(),t:T(d1,h),sp:s,sex:x,age:a,n,shot:false,pos:j(c,.006),acc:9}));
const art=(e,c1,c2)=>{const c=document.createElement('canvas');c.width=800;c.height=600;const g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,600);gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.fillStyle=gr;g.fillRect(0,0,800,600);g.fillStyle='#0003';for(let i=0;i<14;i++){g.beginPath();const x=i*60+(i%3)*12;g.moveTo(x,420);g.lineTo(x+40,180+(i%4)*30);g.lineTo(x+80,420);g.fill()}g.fillStyle='#2a2116';g.fillRect(0,420,800,180);g.font='220px serif';g.textAlign='center';g.fillText(e,400,470);return c.toDataURL('image/jpeg',.7)};
const H1=D.hunts.find(h=>h.date===d1);H1.photos=[{id:uid(),t:T(d1,'10:55'),img:art('🐗','#6d8a6a','#2b3a28'),killId:k1,pos:c,acc:6},{id:uid(),t:T(d1,'14:25'),img:art('🦌','#c9a36a','#5a4630'),killId:k2,pos:c,acc:7},{id:uid(),t:T(d1,'16:40'),img:art('🐕','#8aa0b0','#3a4a3a'),killId:null,pos:c,acc:6},{id:uid(),t:T(d1,'17:05'),img:art('🔥','#d08a4a','#3a2416'),killId:null,pos:c,acc:6}];
const S=(t,s,x,a,n,p)=>({id:uid(),t:T(d1,t),sp:s,sex:x,age:a,n,shot:false,pos:p,acc:7});
const guest=(name,post,pos,kills,nshots,hitsN,sg)=>addImport({format:'carnet-day',v:1,hunter:name,date:d1,place:'Domaine des Chênes, Sologne',post,pos,acc:5,host:me(),type:'Battue',species:[],kills,shots:[...Array(nshots)].map((_,i)=>({id:uid(),t:T(d1,'1'+(i%6)+':0'+i),pos,acc:5,hit:i<hitsN})),sightings:sg});
const pM=[c[0]+.003,c[1]-.004],pS=[c[0]-.002,c[1]+.005],pJ=[c[0]+.005,c[1]+.002];
guest('Marc Fournier','3',pM,[{sp:'boar',sex:'Female',age:'Adult',n:1,time:'10:44',pos:j(pM,.002),thumb:art('🐗','#7a8f5a','#2f3a22')},{sp:'boar',sex:'Unknown',age:'Young',n:1,time:'10:45',pos:j(pM,.002)},{sp:'fox',sex:'Male',age:'Adult',n:1,time:'15:10',pos:j(pM,.002)}],4,3,[S('10:30','boar','Unknown','Adult',6,j(pM,.003)),S('13:05','lynx','Unknown','Adult',1,j(pM,.003))]);
guest('Sophie Bernard','5',pS,[{sp:'roe',sex:'Male',age:'Adult',n:1,time:'11:20',pos:j(pS,.002),thumb:art('🦌','#b9a070','#4a3a26')}],1,1,[S('11:15','roe','Male','Adult',1,j(pS,.003)),S('14:00','kite','Unknown','Adult',2,j(pS,.003))]);
guest('Jean-Luc Moreau','6',pJ,[{sp:'boar',sex:'Male',age:'Young',n:1,time:'14:50',pos:j(pJ,.002)}],5,2,[S('14:40','red','Female','Adult',3,j(pJ,.003))]);
mig(D);const DR=[['La Grande Mare','09:30','4'],['Les Bruyères','11:30','6'],['Bois Brûlé','14:00','2']];
const split=(o,its,mk)=>{o.drives=DR.map((x,i)=>({id:mk?uid():'g'+i,n:i+1,name:x[0],post:mk?x[2]:o.post,start:T(d1,x[1])}));its.forEach(x=>{const t=x.t||T(d1,x.time||'12:00');x.driveId=driveAt(o,t).id})};
split(H1,[...H1.kills,...H1.shots,...H1.photos,...D.sightings.filter(s=>ldate(s.t)===d1)],1);H1.cur=H1.drives[2].id;D.sightings.filter(s=>ldate(s.t)===d1).forEach(s=>s.huntId=H1.id);
const L1=D.locations.find(l=>l.id===H1.locId);if(L1)L1.drives=DR.map(x=>x[0]);
D.imports.filter(p=>p.date===d1).forEach(p=>split(p,[...p.kills,...p.shots,...p.sightings]));
save()}
/* ---------- BOOT ---------- */
async function boot(){const h=location.hash;if(h.startsWith('#import=')){try{const p=JSON.parse(await inflate(h.slice(8)));addImport(p);save();F.hostDate=p.date;history.replaceState(null,'',location.pathname);toast(`Imported ${p.hunter}'s day`);return go('host')}catch(e){toast('This link could not be read')}history.replaceState(null,'',location.pathname)}
if(/[?&]sample\b/.test(location.search)&&!D.hunts.length)sample();const r=h.slice(1);go(V[r]?r:'home')}
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('error',e=>console.error('APPERR',e.message));
boot();
